name: Database Backup

on:
  schedule:
    - cron: "0 2 * * 0"    # Every Sunday at 2 AM UTC (weekly)
    - cron: "0 2 1 * *"    # 1st of every month at 2 AM UTC (monthly)
  workflow_dispatch:        # Allow manual trigger from GitHub UI

jobs:
  backup:
    name: Backup PostgreSQL (Neon)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Install PostgreSQL 18 client
        # The Neon database runs Postgres 18. pg_dump refuses to dump a server
        # newer than itself, and ubuntu-latest ships pg_dump 16 by default, so
        # pull the v18 client from the official PGDG apt repo.
        run: |
          sudo apt-get update
          sudo apt-get install -y curl ca-certificates lsb-release
          sudo install -d /usr/share/postgresql-common/pgdg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo tee /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc >/dev/null
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y postgresql-client-18
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          /usr/lib/postgresql/18/bin/pg_dump --version

      - name: Determine backup type
        id: backup_type
        run: |
          DAY=$(date +%u)   # 1=Mon ... 7=Sun
          DOM=$(date +%d)   # day of month
          if [ "$DOM" = "01" ]; then
            echo "type=monthly" >> $GITHUB_OUTPUT
          else
            echo "type=weekly" >> $GITHUB_OUTPUT
          fi

      - name: Run pg_dump
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          set -o pipefail   # fail the step if pg_dump fails, not just gzip
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_URL secret is not set — nothing to back up."
            exit 1
          fi
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M")
          FILENAME="backup_${{ steps.backup_type.outputs.type }}_${TIMESTAMP}.sql.gz"

          # GitHub secrets often carry a trailing newline from copy-paste, which
          # ends up glued to the last query param (e.g. channel_binding=require\n
          # -> "invalid channel_binding value"). A Postgres URL never contains
          # whitespace, so strip all of it.
          DB_URL="$(printf '%s' "$DATABASE_URL" | tr -d '[:space:]')"

          pg_dump "$DB_URL" | gzip > "$FILENAME"

          # Guard against "green but empty" backups: a real dump of this schema
          # is hundreds of KB minimum. Anything under 10 KB means pg_dump failed
          # or the database is empty — treat it as a failed backup.
          BYTES=$(wc -c < "$FILENAME")
          echo "Backup file: $FILENAME  ($BYTES bytes)"
          if [ "$BYTES" -lt 10240 ]; then
            echo "::error::Backup is only $BYTES bytes — pg_dump almost certainly failed. Contents:"
            gunzip -c "$FILENAME" | head -c 2000
            exit 1
          fi

          echo "BACKUP_FILE=$FILENAME" >> $GITHUB_ENV
          echo "Backup OK: $FILENAME ($(du -sh "$FILENAME" | cut -f1))"

      - name: Upload backup as GitHub artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ steps.backup_type.outputs.type }}-${{ github.run_id }}
          path: ${{ env.BACKUP_FILE }}
          retention-days: 90   # Keep for 90 days

      - name: Summary
        run: |
          echo "### Backup Complete" >> $GITHUB_STEP_SUMMARY
          echo "- **File:** $BACKUP_FILE" >> $GITHUB_STEP_SUMMARY
          echo "- **Type:** ${{ steps.backup_type.outputs.type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time:** $(date -u)" >> $GITHUB_STEP_SUMMARY
