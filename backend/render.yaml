services:
  - type: web
    name: flowcrm-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: node dist/cluster.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: WEB_CONCURRENCY
        value: 1
      - key: DB_POOL_LIMIT
        value: 5
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      - key: JWT_ACCESS_EXPIRES_IN
        value: 15m
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      # RBAC permission matrix: "false" = report-only (log, don't block).
      # Flip to "true" after a release cycle of clean RBAC_WOULD_BLOCK logs.
      - key: RBAC_ENFORCE
        value: "false"
      # Set to "none" if the frontend is on a different domain than this API
      # (e.g. separate *.onrender.com hosts) — otherwise the auth cookie is not
      # sent on XHR and login fails. "lax" is correct only for a shared domain.
      - key: AUTH_COOKIE_SAMESITE
        value: "none"
      - key: FRONTEND_URL
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false
